name: PR Lifecycle Comments

on:
  pull_request:
    types:
      - opened
      - reopened
      - closed

jobs:

  greet-contributor:
    if: github.event.action == 'opened' || github.event.action == 'reopened'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post "waiting for review" comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 👋 Thanks for your contribution, @${context.payload.pull_request.user.login}!

            Your pull request has been received and will be reviewed soon. 
            please be patient, and in the meantime, make sure your branch is u to date and that your CI checks are passing. 

            If you have any questions or want to flag something specific for the reviewer, feel free to leave a comment below. 🙌`
            });


  thank-on-merge:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post "merged" thank-you comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🎉 Merged! Thank you, @${context.payload.pull_request.user.login}!

            Your pull request has been successfully merged into \`${context.payload.pull_request.base.ref}\`. 🚀

            We really appreciate you taking the time to contribute — every improvement matters and yours is now part of the project.

            **You're awesome!** We hope to see more contributions from you in the future. ⭐`
            });


  notify-on-close:
    if: github.event.action == 'closed' && github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post "closed without merge" comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Pull Request Closed

            Hi @${context.payload.pull_request.user.login}, this pull request has been closed without merging.

            **This doesn't mean your effort wasn't valued!** If you believe this was closed by mistake or would like to discuss next steps, please feel free to:
            - Leave a comment here explaining your use case.
            - Open a new issue to discuss the change before submitting again.

            Thank you for taking the time to contribute. 🙏`
            });